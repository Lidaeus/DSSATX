[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["SA_Project_Output", "SA_Project_Docs", "DSSAT_Output_Interpretation"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
show_error_codes = true
exclude = "(SA_Project_Output|SA_Project_Docs|DSSAT_Output_Interpretation)"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
